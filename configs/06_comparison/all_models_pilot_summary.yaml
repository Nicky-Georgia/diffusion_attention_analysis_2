stage:
  id: 06_comparison_all_models_pilot
  name: comparison
  description: "Final all-model summary. SD3 Medium and SANA remain shortened transformer pilots."
  claim_level: comparison
  artifacts:
    - comparison_summary.csv
    - report.json
model:
  name: comparison_all_models
  family: comparison
data:
  output_dir: outputs/comparison/all_models_pilot
comparison:
  interpretation_rules:
    - "Quantitative causal claims are based on SD1.5 and transfer-checked on SDXL."
    - "SD3 Medium and SANA results are architecture pilots: activation diagnostics plus block ablations only."
    - "Do not compare raw attention-localization scores for transformer models unless a validated attention-probability recorder is added."
  inputs:
    - model: sd15
      stage: attention_localization
      claim_level: main
      report_path: outputs/sd15/02_attention_localization/report.json
    - model: sdxl
      stage: attention_localization
      claim_level: transfer
      report_path: outputs/sdxl/02_attention_localization/report.json
    - model: sd3_medium
      stage: transformer_diagnostics
      claim_level: pilot_only
      report_path: outputs/sd3_medium/02_transformer_diagnostics/report.json
    - model: sana
      stage: transformer_diagnostics
      claim_level: pilot_only
      report_path: outputs/sana/02_transformer_diagnostics/report.json
    - model: sd15
      stage: sae_training
      claim_level: main
      report_path: outputs/sd15/03_sae_mid/report.json
    - model: sdxl
      stage: sae_training
      claim_level: transfer
      report_path: outputs/sdxl/03_sae_mid/report.json
    - model: sd3_medium
      stage: sae_pilot
      claim_level: pilot_only
      report_path: outputs/sd3_medium/03_sae_pilot/report.json
    - model: sana
      stage: sae_pilot
      claim_level: pilot_only
      report_path: outputs/sana/03_sae_pilot/report.json
    - model: sd3_medium
      stage: block_ablation
      claim_level: pilot_only
      report_path: outputs/sd3_medium/05_block_ablation/report.json
    - model: sana
      stage: block_ablation
      claim_level: pilot_only
      report_path: outputs/sana/05_block_ablation/report.json
