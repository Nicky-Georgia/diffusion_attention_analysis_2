stage:
  id: 03_sae_training_sana_short
  name: sae_training
  description: "Very small SANA pilot SAE on one transformer block; not used for full causal claims."
  claim_level: pilot_only
  artifacts:
    - sae.pt
    - history.json
    - report.json
model:
  name: sana
  family: transformer
  device: cuda
data:
  capture_dir: outputs/sana/01_capture/captures
  output_dir: outputs/sana/03_sae_pilot
sae:
  layer: transformer_blocks.10
  step: 9
  expansion_factor: 2
  k: 16
  batch_size: 2048
  learning_rate: 0.0001
  weight_decay: 0.0
  num_epochs: 1
  max_activation_files: 128
  max_tokens_per_file: 2048
