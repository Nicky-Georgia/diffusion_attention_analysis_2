stage:
  id: 01_capture_sana_short
  name: capture
  description: "Short transformer pilot for SANA: image generation plus selected block activations only."
  claim_level: pilot_only
  artifacts:
    - samples/*/image.png
    - captures/*/activations/step_*/
model:
  name: sana
  family: transformer
  pipeline_class: sana
  model_id: Efficient-Large-Model/Sana_1600M_1024px_BF16_diffusers
  dtype: bfloat16
  device: cuda
  negative_prompt: null
generation:
  height: 1024
  width: 1024
  guidance_scale: 4.5
  num_inference_steps: 20
  negative_prompt: null
data:
  prompts_path: prompts/pilot_prompts.jsonl
  max_prompts: 64
  output_dir: outputs/sana/01_capture
capture:
  step_indices: [0, 9, 19]
  save_latents: true
  attention:
    enabled: false
    reason: "Shortened SANA path records block outputs and avoids fragile attention-probability instrumentation."
  activation_modules:
    - transformer_blocks.0
    - transformer_blocks.10
    - transformer_blocks.19
runtime:
  seed_start: 0
  num_seeds: 1
  enable_model_cpu_offload: true
  torch_compile: false
  enable_xformers_memory_efficient_attention: false
resources:
  preferred_gpu: g2.2
  minimum_gpu: g2.1
  estimated_storage_gb: 80
