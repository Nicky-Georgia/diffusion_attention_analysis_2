name: SD3 causal v4 CPU smoke tests

on:
  push:
    branches: [research/sd3-iterations-11-14]
  pull_request:
    paths:
      - "src/diffusion_attention_analysis_v2/**"
      - "tests/**"
      - "notebooks/1[1-4]*"
      - ".github/workflows/causal_v4_smoke.yml"

jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install pytest numpy pandas pillow scikit-image
      - name: Test feature algebra and holdout invariants
        run: pytest -q tests/test_causal_controls.py tests/test_sae_causal_v4.py
      - name: Validate notebook JSON and syntax
        run: |
          pip install nbformat
          python - <<'PY'
          import ast
          from pathlib import Path
          import nbformat
          for p in sorted(Path("notebooks").glob("1[1-4]_sd3_*.ipynb")):
              n=nbformat.read(p,as_version=4)
              nbformat.validate(n)
              for cell in n.cells:
                  if cell.cell_type=="code": ast.parse(cell.source)
              print("Validated:",p.name)
          PY
