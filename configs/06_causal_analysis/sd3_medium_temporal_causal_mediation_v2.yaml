stage:
  id: 06_sd3_medium_temporal_causal_mediation_v2
  name: causal_analysis
  description: "Exact temporal-window interchange and cross-fitted causal mediation analysis for SD3 Medium SAE features."
  claim_level: sd3_temporal_interchange_and_sparse_causal_mediation
  artifacts:
    - prompt_pairs.jsonl
    - reference_capture_manifest.csv
    - feature_selection_v2.csv
    - feature_map_v2.json
    - run_manifest_v2.csv
    - semantic_scores_v2.csv
    - causal_estimands_v2.csv
    - causal_summary_v2.csv
    - gated_ratio_summary_v2.csv
    - trajectory_summary_v2.csv
    - decision_table_v2.csv
    - figures/*.png
    - galleries/*.png

model:
  name: sd3_medium
  family: transformer
  pipeline_class: sd3
  model_id: stabilityai/stable-diffusion-3-medium-diffusers
  dtype: float16
  device: cuda
  negative_prompt: ""

generation:
  height: 1024
  width: 1024
  guidance_scale: 7.0
  num_inference_steps: 28
  negative_prompt: ""

data:
  prompts_path: prompts/sd3_medium_sae_circuit_150.jsonl
  baseline_samples_dir: outputs/sd3_medium_sae_circuit_150/01_capture/samples
  previous_causal_dir: outputs/sd3_medium_sae_circuit_150/06_causal_faithfulness
  existing_steering_analysis_dir: outputs/sd3_medium_sae_circuit_150/05_interventions/sae_steering_recommended_v2/_analysis
  output_dir: outputs/sd3_medium_sae_circuit_150/06_causal_mediation_v2

sites:
  early:
    enabled: true
    module: transformer_blocks.0
    anchor_step: 0
    window_steps: [0, 1, 2, 3, 4]
    sae_checkpoint: outputs/sd3_medium_sae_circuit_150/03_sae/early_block0_step0/sae.pt
    concept_dictionary: outputs/sd3_medium_sae_circuit_150/04_concept_dictionary/early_block0_step0/concept_dictionary.csv
    probe_module: transformer_blocks.11
    probe_step: 13
  mid:
    enabled: true
    module: transformer_blocks.11
    anchor_step: 13
    window_steps: [11, 12, 13, 14, 15]
    sae_checkpoint: outputs/sd3_medium_sae_circuit_150/03_sae/mid_block11_step13/sae.pt
    concept_dictionary: outputs/sd3_medium_sae_circuit_150/04_concept_dictionary/mid_block11_step13/concept_dictionary.csv
    probe_module: transformer_blocks.23
    probe_step: 27
  late:
    enabled: false
    module: transformer_blocks.23
    anchor_step: 27
    window_steps: [23, 24, 25, 26, 27]
    sae_checkpoint: outputs/sd3_medium_sae_circuit_150/03_sae/late_block23_step27/sae.pt
    concept_dictionary: outputs/sd3_medium_sae_circuit_150/04_concept_dictionary/late_block23_step27/concept_dictionary.csv
    probe_module: transformer_blocks.23
    probe_step: 27

design:
  run_sites: [early, mid]
  target_labels: [dog, cat, car, book, bicycle, person]
  prompts_per_label: 2
  seed: 0
  replacement_pool: [apple, chair, lamp, boat, horse, flower, umbrella, window]
  reuse_previous_pairs: true
  pilot_only: true
  arms:
    - dest_full_anchor_exact
    - dest_full_window_exact
    - dest_dictionary_window_exact
    - dest_contrastive_anchor_exact
    - dest_contrastive_window_exact
    - dest_control_window_exact
    - source_contrastive_reverse_window_exact

feature_selection:
  features_per_set: 4
  dictionary:
    require_top_dictionary_label: true
    max_reuse: 4
  contrastive:
    crossfit_by_pair: true
    top_fraction_tokens: 0.05
    multiply_decoder_norm: true
    positive_source_minus_destination_only: true
  control:
    match_decoder_norm: true
    match_natural_delta_energy: true
    exclude_target_dictionary_features: true

patching:
  branch_mode: cond
  exact_full_residual: true
  exact_sae_delta: true
  rms_clipping: false
  spatial_mode: all_tokens
  reference_cache_dtype: float16

evaluation:
  clipseg_model_id: CIDAS/clipseg-rd64-refined
  clip_model_id: openai/clip-vit-base-patch32
  device: cuda
  clipseg_top_fraction: 0.05
  clipseg_mask_threshold: 0.50
  image_metric_size: 256
  min_total_effect: 0.05
  min_full_window_effect: 0.02
  bootstrap_resamples: 5000
  randomization_resamples: 20000
  multiplicity: holm
  primary_outcome: local_margin
  secondary_outcome: global_margin

runtime:
  enable_model_cpu_offload: true
  enable_xformers_memory_efficient_attention: false
  force_rerun: false
