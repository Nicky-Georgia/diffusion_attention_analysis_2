stage:
  id: 05_intervention_sd15_sae_steering
  name: intervention
  description: "SD1.5 feature-level causal probe: steer SAE-discovered concepts in the middle block."
  claim_level: main
  artifacts:
    - samples/*/steered.png
    - report.json
model:
  name: sd15
  family: unet
  pipeline_class: auto_t2i
  model_id: runwayml/stable-diffusion-v1-5
  dtype: float16
  device: cuda
  negative_prompt: ""
generation:
  height: 512
  width: 512
  guidance_scale: 7.5
  num_inference_steps: 50
  negative_prompt: ""
data:
  prompts_path: prompts/intervention_prompts.jsonl
  sae_checkpoint: outputs/sd15/03_sae_mid/sae.pt
  output_dir: outputs/sd15/05_intervention_sae_steering
intervention:
  kind: sae_steering
  module: mid_block.attentions.0
  target_steps: [24]
  concept_ids: [0, 1]
  betas: [-2.0, 2.0]
runtime:
  seed_start: 0
  num_seeds: 2
  enable_model_cpu_offload: false
